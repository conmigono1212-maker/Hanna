name: Build Hanna APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hanna
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p build_source
          unzip -o CyberAssistant_Android_Strong.zip -d build_source

          GRADLEW="$(find build_source -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew dentro del proyecto Android."
            find build_source -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado: $PROJECT_DIR"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p apk_output

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*.apk' \
            -print \
            -exec cp {} apk_output/ \;

          if [ -z "$(find apk_output -type f -name '*.apk' -print -quit)" ]; then
            echo "ERROR: No se encontró ningún APK después de la compilación."
            exit 1
          fi

          ls -lh apk_output

      - name: Upload Hanna APK
        uses: actions/upload-artifact@v4
        with:
          name: Hanna-APK
          path: apk_output/*.apk
          if-no-files-found: error
