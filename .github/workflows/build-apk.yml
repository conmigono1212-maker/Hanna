name: Build Hanna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto Android
        run: |
          unzip -o CyberAssistant_Android_Strong.zip -d android_project

      - name: Encontrar Gradle y compilar APK
        shell: bash
        run: |
          set -e

          echo "Buscando gradlew..."

          GRADLEW=$(find android_project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew dentro del proyecto."
            echo "Contenido encontrado:"
            find android_project -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Gradle encontrado en:"
          echo "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          chmod +x "$GRADLEW"

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace

      - name: Buscar APK generado
        run: |
          find android_project -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hanna-APK
          path: android_project/**/*.apk
          if-no-files-found: error
