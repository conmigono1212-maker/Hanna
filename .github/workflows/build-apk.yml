name: Build Hanna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar proyecto Android
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUSCANDO PROYECTO ANDROID"
          echo "========================================"

          ZIP=""

          if [ -f "Hanna_APK_READY_source.zip" ]; then
            ZIP="Hanna_APK_READY_source.zip"
          elif [ -f "CyberAssistant_Android_Strong.zip" ]; then
            ZIP="CyberAssistant_Android_Strong.zip"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP del proyecto Android."
            echo "Archivos disponibles:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf android-source
          mkdir -p android-source

          echo "Descomprimiendo proyecto..."
          unzip -oq "$ZIP" -d android-source

          echo "========================================"
          echo "BUSCANDO settings.gradle"
          echo "========================================"

          SETTINGS=$(find android-source -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts"
            echo ""
            echo "Contenido del ZIP:"
            find android-source -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "========================================"
          echo "VERIFICANDO PROYECTO"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo "Directorio actual:"
          pwd

          echo ""
          echo "Contenido:"
          ls -la

          echo ""
          echo "Archivos Gradle:"
          find . -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print

          echo "========================================"
          echo "CONFIGURANDO GRADLE PROPERTIES"
          echo "========================================"

          PROPS="gradle.properties"

          touch "$PROPS"

          if grep -q '^android.useAndroidX=' "$PROPS"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROPS"
          else
            echo 'android.useAndroidX=true' >> "$PROPS"
          fi

          if grep -q '^android.enableJetifier=' "$PROPS"; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROPS"
          else
            echo 'android.enableJetifier=true' >> "$PROPS"
          fi

          if grep -q '^org.gradle.jvmargs=' "$PROPS"; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8/' "$PROPS"
          else
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> "$PROPS"
          fi

          if ! grep -q '^kotlin.jvm.target.validation.mode=' "$PROPS"; then
            echo 'kotlin.jvm.target.validation.mode=warning' >> "$PROPS"
          fi

          echo ""
          echo "gradle.properties:"
          cat "$PROPS"

          echo "========================================"
          echo "BUSCANDO MEMORYSTORE.KT"
          echo "========================================"

          MEMORY_STORE=$(find . -type f -name "MemoryStore.kt" -print -quit || true)

          if [ -n "$MEMORY_STORE" ]; then

            echo "MemoryStore encontrado:"
            echo "$MEMORY_STORE"

            echo ""
            echo "Contenido inicial:"
            nl -ba "$MEMORY_STORE" | sed -n '1,80p'

            python3 - "$MEMORY_STORE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          changed = False

          for i, line in enumerate(lines):

              if re.search(r'\bfun\s+keys\b', line) and '(' not in line:

                  new_line = re.sub(
                      r'\bfun\s+keys\b',
                      'val keys',
                      line,
                      count=1
                  )

                  if new_line.rstrip().endswith(">>"):
                      newline = "\n" if new_line.endswith("\n") else ""
                      content = new_line.rstrip("\n")
                      content = content[:-1]
                      new_line = content + newline

                  if new_line != line:
                      lines[i] = new_line
                      changed = True
                      print(
                          f"CORRECCIÓN APLICADA EN LÍNEA {i + 1}"
                      )

          if changed:
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(lines)

              print("MemoryStore.kt fue corregido automáticamente.")
          else:
              print(
                  "No se encontró una declaración 'fun keys' "
                  "que requiera esta corrección."
              )
          PY

            echo ""
            echo "MemoryStore.kt después de la revisión:"
            nl -ba "$MEMORY_STORE" | sed -n '1,80p'

          else
            echo "ADVERTENCIA: No se encontró MemoryStore.kt."
            echo "Se continúa con la compilación."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar Java
        shell: bash
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version
          javac -version

      - name: Verificar Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: El proyecto no contiene gradlew."
            echo ""
            echo "Contenido del proyecto:"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew

          echo "gradlew encontrado."

          ./gradlew --version

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "COMPILANDO HANNA"
          echo "========================================"

          echo "Directorio:"
          pwd

          echo ""
          echo "Contenido:"
          ls -la

          echo ""
          echo "Iniciando Gradle..."

          chmod +x ./gradlew

          ./gradlew clean assembleDebug \
            --stacktrace \
            --info

      - name: Buscar APK generado
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "BUSCANDO APK"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hanna-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
