name: Build Hanna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar proyecto Android
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUSCANDO PROYECTO ANDROID"
          echo "========================================"

          if [ -f "Hanna_APK_READY_source.zip" ]; then
            ZIP="Hanna_APK_READY_source.zip"
          elif [ -f "CyberAssistant_Android_Strong.zip" ]; then
            ZIP="CyberAssistant_Android_Strong.zip"
          else
            echo "ERROR: No se encontró el ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf android-source
          mkdir -p android-source

          unzip -oq "$ZIP" -d android-source

          echo "========================================"
          echo "BUSCANDO PROYECTO"
          echo "========================================"

          SETTINGS=$(find android-source -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find android-source -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            echo "Archivos encontrados:"
            find android-source -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "========================================"
          echo "CONTENIDO DEL PROYECTO"
          echo "========================================"

          cd "$PROJECT_DIR"

          pwd
          ls -la

          echo "========================================"
          echo "CONFIGURANDO GRADLE PROPERTIES"
          echo "========================================"

          touch gradle.properties

          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          if grep -q '^android.enableJetifier=' gradle.properties; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8/' gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> gradle.properties
          fi

          echo "========================================"
          echo "PROYECTO LISTO"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar Java y Gradle
        shell: bash
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version
          javac -version

          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          gradle --version

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "COMPILANDO HANNA"
          echo "========================================"

          echo "Directorio:"
          pwd

          echo "Contenido:"
          ls -la

          echo "========================================"
          echo "EJECUTANDO GRADLE"
          echo "========================================"

          gradle clean assembleDebug --stacktrace --info

      - name: Buscar APK generado
        shell: bash
        run: |
          echo "========================================"
          echo "BUSCANDO APK"
          echo "========================================"

          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hanna-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
