name: Build Hanna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Verificar proyecto Android
        working-directory: android_project/CyberAssistant_Android_Strong
        run: |
          echo "Contenido del proyecto:"
          ls -la
          echo "Contenido de app:"
          ls -la app

      - name: Compilar APK
        working-directory: android_project/CyberAssistant_Android_Strong
        run: |
          gradle assembleDebug --stacktrace

      - name: Buscar APK generado
        run: |
          echo "APK encontrados:"
          find android_project/CyberAssistant_Android_Strong -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hanna-APK
          path: android_project/CyberAssistant_Android_Strong/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
