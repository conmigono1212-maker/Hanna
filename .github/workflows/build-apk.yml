name: Build Hanna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar proyecto Android
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUSCANDO PROYECTO ANDROID"
          echo "========================================"

          ZIP=""

          if [ -f "Hanna_APK_READY_source.zip" ]; then
            ZIP="Hanna_APK_READY_source.zip"
          elif [ -f "CyberAssistant_Android_Strong.zip" ]; then
            ZIP="CyberAssistant_Android_Strong.zip"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP del proyecto Android."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p android-source

          echo "Descomprimiendo proyecto..."
          unzip -oq "$ZIP" -d android-source

          echo "Buscando proyecto..."

          SETTINGS=$(find android-source -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "========================================"
          echo "CONFIGURANDO ANDROIDX"
          echo "========================================"

          PROPS="$PROJECT_DIR/gradle.properties"

          touch "$PROPS"

          if grep -q '^android.useAndroidX=' "$PROPS"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROPS"
          else
            echo 'android.useAndroidX=true' >> "$PROPS"
          fi

          if grep -q '^android.enableJetifier=' "$PROPS"; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROPS"
          else
            echo 'android.enableJetifier=true' >> "$PROPS"
          fi

          if grep -q '^org.gradle.jvmargs=' "$PROPS"; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8/' "$PROPS"
          else
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> "$PROPS"
          fi

          echo 'kotlin.jvm.target.validation.mode=warning' >> "$PROPS"

          echo "========================================"
          echo "CONFIGURANDO JAVA Y KOTLIN 17"
          echo "========================================"

          cat >> "$PROJECT_DIR/build.gradle.kts" <<'EOF'

          // Configuración automática Java/Kotlin 17
          allprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }

              tasks.withType<JavaCompile>().configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          EOF

          echo "========================================"
          echo "BUSCANDO Y CORRIGIENDO MEMORYSTORE.KT"
          echo "========================================"

          MEMORY_STORE=$(find "$PROJECT_DIR" -type f -name "MemoryStore.kt" -print -quit)

          if [ -z "$MEMORY_STORE" ]; then
            echo "ERROR: No se encontró MemoryStore.kt"
            exit 1
          fi

          echo "MemoryStore encontrado:"
          echo "$MEMORY_STORE"

          echo "Contenido inicial de MemoryStore.kt:"
          nl -ba "$MEMORY_STORE" | sed -n '1,30p'

          python3 - "$MEMORY_STORE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          changed = False

          for i, line in enumerate(lines):
              stripped = line.strip()

              # El error de compilación indica una declaración
              # inválida de "keys" sin cuerpo.
              # Si aparece como "fun keys" sin paréntesis,
              # se trata como una propiedad Kotlin.
              if re.search(r'\bfun\s+keys\b', line) and '(' not in line:
                  new_line = re.sub(r'\bfun\s+keys\b', 'val keys', line, count=1)

                  # Corrige un posible ">>" sobrante al final
                  # de la declaración del tipo genérico.
                  if new_line.rstrip().endswith(">>"):
                      newline = "\n" if new_line.endswith("\n") else ""
                      content = new_line.rstrip("\n")
                      content = content[:-1]
                      new_line = content + newline

                  if new_line != line:
                      lines[i] = new_line
                      changed = True
                      print(f"CORRECCIÓN APLICADA EN LÍNEA {i + 1}")

          if changed:
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(lines)
              print("MemoryStore.kt fue corregido automáticamente.")
          else:
              print("No se encontró una declaración 'fun keys' que requiera esta corrección.")
          PY

          echo "========================================"
          echo "MEMORYSTORE.KT DESPUÉS DE LA CORRECCIÓN"
          echo "========================================"

          nl -ba "$MEMORY_STORE" | sed -n '1,30p'

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar Java
        shell: bash
        run: |
          java -version
          javac -version
          gradle --version

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "COMPILANDO HANNA"
          echo "========================================"

          echo "Directorio:"
          pwd

          echo "Archivos:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Buscar APK generado
        shell: bash
        run: |
          echo "========================================"
          echo "BUSCANDO APK"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hanna-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
