name: Build Hanna APK

on:
  workflow_dispatch:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto Android
        run: |
          unzip -o CyberAssistant_Android_Strong.zip -d .

      - name: Dar permisos a Gradle
        working-directory: CyberAssistant_Android_Strong
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: CyberAssistant_Android_Strong
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hanna-APK
          path: CyberAssistant_Android_Strong/app/build/outputs/apk/debug/app-debug.apk
