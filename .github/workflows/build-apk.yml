name: Build Hanna APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar proyecto Android
        shell: bash
        run: |
          set -e

          echo "Buscando archivo ZIP del proyecto Android..."

          ZIP=""

          if [ -f "Hanna_APK_READY_source.zip" ]; then
            ZIP="Hanna_APK_READY_source.zip"
          elif [ -f "CyberAssistant_Android_Strong.zip" ]; then
            ZIP="CyberAssistant_Android_Strong.zip"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP del proyecto Android."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p android-source

          echo "Descomprimiendo proyecto..."
          unzip -oq "$ZIP" -d android-source

          echo "Buscando settings.gradle..."

          SETTINGS=$(find android-source -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts"
            echo "Contenido encontrado:"
            find android-source -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto Android encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Directorio del proyecto:"
          pwd

          echo "Archivos del proyecto:"
          ls -la

          if [ -f "./gradlew" ]; then
            echo "Usando Gradle Wrapper..."
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "No hay Gradle Wrapper."
            echo "Usando Gradle instalado..."
            gradle assembleDebug --stacktrace
          fi

      - name: Buscar APK generado
        shell: bash
        run: |
          echo "Buscando APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hanna-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
