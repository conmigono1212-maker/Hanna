name: Build HANNAH APK

on:
  workflow_dispatch:
  push:
    branches: [main, hannah-plataformas]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        working-directory: android
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: HANNAH-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar menú, búsqueda y chat en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          script: python3 android/verify_menu.py
