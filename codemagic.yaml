
workflows:
  hannah-android:
    name: Compilar HANNAH APK
    max_build_duration: 60
    environment:
      java: 17

    scripts:
      - name: Preparar proyecto HANNAH
        script: |
          set -e

          if [ -f Hanna_APK_READY_source.zip ]; then
            ZIP=Hanna_APK_READY_source.zip
          elif [ -f CyberAssistant_Android_Strong.zip ]; then
            ZIP=CyberAssistant_Android_Strong.zip
          else
            echo "ERROR: No se encontró el ZIP Android"
            exit 1
          fi

          mkdir -p android-source
          unzip -oq "$ZIP" -d android-source

          SETTINGS=$(find android-source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró el proyecto Gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "$PROJECT_DIR" > /tmp/hannah-project-dir

          touch "$PROJECT_DIR/gradle.properties"
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Corregir API experimental de Compose
        script: |
          set -e
          PROJECT_DIR=$(cat /tmp/hannah-project-dir)
          MAIN="$PROJECT_DIR/app/src/main/java/com/cyberassistant/ui/MainActivity.kt"
          if [ -f "$MAIN" ] && ! grep -q 'OptIn(androidx.compose.material3.ExperimentalMaterial3Api' "$MAIN"; then
            python3 - "$MAIN" <<'PY'
            import pathlib, sys
            path = pathlib.Path(sys.argv[1])
            source = path.read_text()
            path.write_text("@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n" + source)
            PY
          fi

      - name: Corregir MemoryStore Kotlin
        script: |
          set -e
          PROJECT_DIR=$(cat /tmp/hannah-project-dir)
          MEMORY="$PROJECT_DIR/app/src/main/java/com/cyberassistant/memory/MemoryStore.kt"
          if [ ! -f "$MEMORY" ]; then
            echo "ERROR: No se encontró MemoryStore.kt"
            exit 1
          fi
          python3 - "$MEMORY" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          pattern = r'(?m)^\s*fun\s+keys\s*\([^)]*\)\s*:\s*Set\s*<\s*String\s*[^\n]*
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/hannah-project-dir)

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          else
            echo "ERROR: No se encontró app/build.gradle"
            exit 1
          fi

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

    artifacts:
      - android-source/**/build/outputs/apk/**/*.apk

          replacement = '    fun keys(): Set<String> = memory.keys'
          if not re.search(pattern, source):
              print("ERROR: No se encontró la declaración esperada de keys()")
              sys.exit(1)
          source = re.sub(pattern, replacement, source, count=1)
          path.write_text(source)
          PY

      - name: Compilar APK Android
        script: |
          set -e

          PROJECT_DIR=$(cat /tmp/hannah-project-dir)

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          else
            echo "ERROR: No se encontró app/build.gradle"
            exit 1
          fi

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

    artifacts:
      - android-source/**/build/outputs/apk/**/*.apk
